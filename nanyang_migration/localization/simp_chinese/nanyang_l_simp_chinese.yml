l_simp_chinese:
 je_nanyang_migration:0 "下南洋"
 je_nanyang_migration_reason:0 "早有乡民自闽粤沿海扬帆，赴南洋谋生。如今官府可召集愿意远行的人家，为他们安排航程，到异乡安家。\n\n已办航次：[GetPlayer.MakeScope.ScriptValue('nym_uses')|0]　待发人数：[GetPlayer.MakeScope.ScriptValue('nym_target')|0]\n上次计划：[GetPlayer.MakeScope.ScriptValue('nym_last_target')|0] 人　上次抵达：[GetPlayer.MakeScope.ScriptValue('nym_last')|0] 人\n本次顺利启航后，下次可筹办 [GetPlayer.MakeScope.ScriptValue('nym_following_target')|0] 人。"
 nym_organize_name:0 "组织下南洋"
 nym_organize_desc:0 "筹办一次赴南洋的航程，计划从本国各州招募 [GetPlayer.MakeScope.ScriptValue('nym_target')|0] 人。\n\n闽人占45%，粤人占30%，客家人占15%，汉人占10%。\n马来亚及新加坡接收35%，荷属东印度25%，暹罗20%，印度支那12%，菲律宾5%，缅甸3%。\n\n首航计划 200,000 人。每次成功后，下一航次的计划人数增加 25%，最多 500,000 人。两次成功航次之间须休整 3 个游戏年。"
 nym_cooldown_tt:0 "船队的休整期已结束。"
 nym_pending_tt:0 "上次航程尚未结报，暂不能再派船队。"
 nym_attempt_tt:0 "派船将应募人家送往南洋。实际抵达人数将在航程结束后公布。"
 nym_success_title:0 "南洋的新家园"
 nym_success_desc:0 "满载行囊的船队已抵达南洋。移民们在港口登岸，准备在当地谋生、安家。\n\n本次计划 [GetPlayer.MakeScope.ScriptValue('nym_last_target')|0] 人，实际抵达 [GetPlayer.MakeScope.ScriptValue('nym_last')|0] 人。\n下一航次可筹办 [GetPlayer.MakeScope.ScriptValue('nym_target')|0] 人，船队需休整 3 个游戏年。"
 nym_failure_title:0 "航程未能启行"
 nym_failure_desc:0 "这趟航程未能成行，本次没有派遣移民。待条件合适，便可再次筹办。"
 nym_pending_title:0 "航报未至"
 nym_pending_desc:0 "各港的回报尚未齐备，官府暂缓派出下一支船队。如需重新筹办这次航程，请载入启航前的存档。"
 nym_ack:0 "知悉"
