l_simp_chinese:
 je_nanyang_migration:0 "下南洋"
 je_nanyang_migration_reason:0 "自闽粤沿海至南洋诸邦，华人远渡重洋、经商谋生，渐成海外聚落。国家可以组织大规模移民，使闽人、粤人、客家人与汉人迁往东南亚，在异域建立新的家园。\n\n累计成功：[GetPlayer.MakeScope.ScriptValue('nym_uses')|0] 次；本次计划：[GetPlayer.MakeScope.ScriptValue('nym_target')|0] 人。\n上次计划：[GetPlayer.MakeScope.ScriptValue('nym_last_target')|0] 人；上次实际完成：[GetPlayer.MakeScope.ScriptValue('nym_last')|0] 人。\n本次成功后的下一次目标：[GetPlayer.MakeScope.ScriptValue('nym_following_target')|0] 人。冷却状态请查看按钮条件；成功后须等待5个游戏年。"
 nym_organize_name:0 "组织下南洋"
 nym_organize_desc:0 "本次计划迁移 [GetPlayer.MakeScope.ScriptValue('nym_target')|0] 人。来源为本国所有拥有的州，不设省份限制。\n文化总比例：闽45%、粤30%、客家15%、汉10%。\n目的地：马来亚及新加坡35%、荷属东印度25%、暹罗20%、印度支那12%、菲律宾5%、缅甸3%。按固定交叉矩阵执行；州内不设子地区权重，实际州等额分配并补整数余数。\n成功后冷却5年，下一次增加25%，上限500万人。人口或有效目的地不足时仅完成可行部分；零迁移不扣次数与冷却。"
 nym_cooldown_tt:0 "距离上一次成功组织下南洋已满5个游戏年（首次无需等待）"
 nym_attempt_tt:0 "立即按固定文化与地理矩阵组织真实人口迁移；完成量见结果通知。"
 nym_success_title:0 "南洋的新家园"
 nym_success_desc:0 "本次目标：[GetPlayer.MakeScope.ScriptValue('nym_last_target')|0] 人。\n实际迁移：[GetPlayer.MakeScope.ScriptValue('nym_last')|0] 人。\n累计成功：[GetPlayer.MakeScope.ScriptValue('nym_uses')|0] 次。下次目标：[GetPlayer.MakeScope.ScriptValue('nym_target')|0] 人。\n已进入5年冷却。人口不足或目的地不可用的份额不会用其他文化或地区补足。移民保留文化与宗教，抵达后按原生规则失业或转职。\n\n1.1.0 RC4 诊断：来源POP数 [GetPlayer.MakeScope.Var('nym_source_count').GetValue|0]；来源总人口 [GetPlayer.MakeScope.Var('nym_source_people').GetValue|0]。\n目的州数（马来亚/东印度/暹罗/印度支那/菲律宾/缅甸）：[GetPlayer.MakeScope.Var('nym_count_malaya').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_east_indies').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_siam').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_indochina').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_philippines').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_burma').GetValue|0]。\n启动配额 [GetPlayer.MakeScope.Var('nym_cells_started').GetValue|0]；正额度州份数 [GetPlayer.MakeScope.Var('nym_positive_shares').GetValue|0]；同文化候选 [GetPlayer.MakeScope.Var('nym_culture_candidates').GetValue|0]；通过筛选的来源与目的配对 [GetPlayer.MakeScope.Var('nym_source_matches').GetValue|0]。\n转移调用次数 [GetPlayer.MakeScope.Var('nym_transfer_calls').GetValue|0]；请求人口合计 [GetPlayer.MakeScope.Var('nym_transfer_requested').GetValue|0]；记录迁入合计 [GetPlayer.MakeScope.Var('nym_actual').GetValue|0]。\n若进入待确认，请保留截图与本次 error.log。\n末笔请求 [GetPlayer.MakeScope.Var('nym_last_request').GetValue|0]；来源减少 [GetPlayer.MakeScope.Var('nym_source_delta').GetValue|0]；目的增加 [GetPlayer.MakeScope.Var('nym_destination_delta').GetValue|0]。"
 nym_failure_title:0 "下南洋：本次未发出转移请求"
 nym_failure_desc:0 "本次没有调用原生人口移动效果。诊断依次显示来源、目的州、额度、配对和调用次数。\n\n1.1.0 RC4 诊断：来源POP数 [GetPlayer.MakeScope.Var('nym_source_count').GetValue|0]；来源总人口 [GetPlayer.MakeScope.Var('nym_source_people').GetValue|0]。\n目的州数（马来亚/东印度/暹罗/印度支那/菲律宾/缅甸）：[GetPlayer.MakeScope.Var('nym_count_malaya').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_east_indies').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_siam').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_indochina').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_philippines').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_burma').GetValue|0]。\n启动配额 [GetPlayer.MakeScope.Var('nym_cells_started').GetValue|0]；正额度州份数 [GetPlayer.MakeScope.Var('nym_positive_shares').GetValue|0]；同文化候选 [GetPlayer.MakeScope.Var('nym_culture_candidates').GetValue|0]；通过筛选的来源与目的配对 [GetPlayer.MakeScope.Var('nym_source_matches').GetValue|0]。\n转移调用次数 [GetPlayer.MakeScope.Var('nym_transfer_calls').GetValue|0]；请求人口合计 [GetPlayer.MakeScope.Var('nym_transfer_requested').GetValue|0]；记录迁入合计 [GetPlayer.MakeScope.Var('nym_actual').GetValue|0]。\n若进入待确认，请保留截图与本次 error.log。\n末笔请求 [GetPlayer.MakeScope.Var('nym_last_request').GetValue|0]；来源减少 [GetPlayer.MakeScope.Var('nym_source_delta').GetValue|0]；目的增加 [GetPlayer.MakeScope.Var('nym_destination_delta').GetValue|0]。"
 nym_ack:0 "知悉"
 nym_pending_tt:0 "上次转移尚未确认。请查看结果和日志，或载入操作前的存档。"
 nym_pending_title:0 "下南洋：迁移待确认"
 nym_pending_desc:0 "本次移动后的来源与目的 POP 读数未能确认同一笔转移。已停止后续移动并锁定重试。\n\n1.1.0 RC4 诊断：来源POP数 [GetPlayer.MakeScope.Var('nym_source_count').GetValue|0]；来源总人口 [GetPlayer.MakeScope.Var('nym_source_people').GetValue|0]。\n目的州数（马来亚/东印度/暹罗/印度支那/菲律宾/缅甸）：[GetPlayer.MakeScope.Var('nym_count_malaya').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_east_indies').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_siam').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_indochina').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_philippines').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_burma').GetValue|0]。\n启动配额 [GetPlayer.MakeScope.Var('nym_cells_started').GetValue|0]；正额度州份数 [GetPlayer.MakeScope.Var('nym_positive_shares').GetValue|0]；同文化候选 [GetPlayer.MakeScope.Var('nym_culture_candidates').GetValue|0]；通过筛选的来源与目的配对 [GetPlayer.MakeScope.Var('nym_source_matches').GetValue|0]。\n转移调用次数 [GetPlayer.MakeScope.Var('nym_transfer_calls').GetValue|0]；请求人口合计 [GetPlayer.MakeScope.Var('nym_transfer_requested').GetValue|0]；记录迁入合计 [GetPlayer.MakeScope.Var('nym_actual').GetValue|0]。\n若进入待确认，请保留截图与本次 error.log。\n末笔请求 [GetPlayer.MakeScope.Var('nym_last_request').GetValue|0]；来源减少 [GetPlayer.MakeScope.Var('nym_source_delta').GetValue|0]；目的增加 [GetPlayer.MakeScope.Var('nym_destination_delta').GetValue|0]。"
