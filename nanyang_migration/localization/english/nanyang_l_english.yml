l_english:
 je_nanyang_migration:0 "Nanyang Migration"
 je_nanyang_migration_reason:0 "Chinese communities cross the seas to establish new homes in Southeast Asia. Organize immediate migration from all owned states.\n\nSuccessful expeditions: [GetPlayer.MakeScope.ScriptValue('nym_uses')|0]. Current target: [GetPlayer.MakeScope.ScriptValue('nym_target')|0] persons.\nLast target: [GetPlayer.MakeScope.ScriptValue('nym_last_target')|0]; last actual: [GetPlayer.MakeScope.ScriptValue('nym_last')|0].\nFollowing target after success: [GetPlayer.MakeScope.ScriptValue('nym_following_target')|0]. Consult the button conditions for the five-year cooldown."
 nym_organize_name:0 "Organize Nanyang Migration"
 nym_organize_desc:0 "Target: [GetPlayer.MakeScope.ScriptValue('nym_target')|0] persons from all owned states, without source province restrictions.\nCultures: Min 45%, Yue 30%, Hakka 15%, Han 10%.\nDestinations: Malaya/Singapore 35%, East Indies 25%, Siam 20%, Indochina 12%, Philippines 5%, Burma 3%, using the fixed cross-matrix. Equal shares across actual states with integer remainders.\nFive-year cooldown on success; target grows by 25%, capped at 5 million. Shortages permit partial execution; zero movement consumes neither cooldown nor a successful use."
 nym_cooldown_tt:0 "Five in-game years have elapsed since the last successful expedition (no wait for first use)"
 nym_attempt_tt:0 "Immediately transfer existing people using the fixed culture/geography matrix; see the result notification for actual movement."
 nym_success_title:0 "New Homes in Nanyang"
 nym_success_desc:0 "Target: [GetPlayer.MakeScope.ScriptValue('nym_last_target')|0] persons.\nActually moved: [GetPlayer.MakeScope.ScriptValue('nym_last')|0].\nSuccessful expeditions: [GetPlayer.MakeScope.ScriptValue('nym_uses')|0]. Next target: [GetPlayer.MakeScope.ScriptValue('nym_target')|0].\nA five-year cooldown has begun. Unavailable shares are not reassigned. Migrants retain their culture and religion; native rules govern unemployment and occupational changes.\n\n1.1.0 RC2 diagnostics: source POPs [GetPlayer.MakeScope.Var('nym_source_count').GetValue|0]; source persons [GetPlayer.MakeScope.Var('nym_source_people').GetValue|0].\nDestination states (Malaya/East Indies/Siam/Indochina/Philippines/Burma): [GetPlayer.MakeScope.Var('nym_count_malaya').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_east_indies').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_siam').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_indochina').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_philippines').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_burma').GetValue|0].\nAllocation cells started [GetPlayer.MakeScope.Var('nym_cells_started').GetValue|0]; positive state shares [GetPlayer.MakeScope.Var('nym_positive_shares').GetValue|0]; eligible source-to-destination pairs [GetPlayer.MakeScope.Var('nym_source_matches').GetValue|0].\nMove calls [GetPlayer.MakeScope.Var('nym_transfer_calls').GetValue|0]; requested persons [GetPlayer.MakeScope.Var('nym_transfer_requested').GetValue|0]; recorded arrivals [GetPlayer.MakeScope.Var('nym_actual').GetValue|0].\nIf verification is blocked, retain this report and error.log.\nLast request [GetPlayer.MakeScope.Var('nym_last_request').GetValue|0]; source decrease [GetPlayer.MakeScope.Var('nym_source_delta').GetValue|0]; destination increase [GetPlayer.MakeScope.Var('nym_destination_delta').GetValue|0]."
 nym_failure_title:0 "Nanyang: No Transfer Requested"
 nym_failure_desc:0 "No native move was called. The diagnostics show sources, destinations, allocation, eligible pairs and move calls.\n\n1.1.0 RC2 diagnostics: source POPs [GetPlayer.MakeScope.Var('nym_source_count').GetValue|0]; source persons [GetPlayer.MakeScope.Var('nym_source_people').GetValue|0].\nDestination states (Malaya/East Indies/Siam/Indochina/Philippines/Burma): [GetPlayer.MakeScope.Var('nym_count_malaya').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_east_indies').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_siam').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_indochina').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_philippines').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_burma').GetValue|0].\nAllocation cells started [GetPlayer.MakeScope.Var('nym_cells_started').GetValue|0]; positive state shares [GetPlayer.MakeScope.Var('nym_positive_shares').GetValue|0]; eligible source-to-destination pairs [GetPlayer.MakeScope.Var('nym_source_matches').GetValue|0].\nMove calls [GetPlayer.MakeScope.Var('nym_transfer_calls').GetValue|0]; requested persons [GetPlayer.MakeScope.Var('nym_transfer_requested').GetValue|0]; recorded arrivals [GetPlayer.MakeScope.Var('nym_actual').GetValue|0].\nIf verification is blocked, retain this report and error.log.\nLast request [GetPlayer.MakeScope.Var('nym_last_request').GetValue|0]; source decrease [GetPlayer.MakeScope.Var('nym_source_delta').GetValue|0]; destination increase [GetPlayer.MakeScope.Var('nym_destination_delta').GetValue|0]."
 nym_ack:0 "Understood"
 nym_pending_tt:0 "The previous transfer is unconfirmed. Check the report and logs or load a save from before the attempt."
 nym_pending_title:0 "Nanyang: Transfer Unconfirmed"
 nym_pending_desc:0 "The source and destination POP readings did not confirm the same transfer. Further moves and retries are locked.\n\n1.1.0 RC2 diagnostics: source POPs [GetPlayer.MakeScope.Var('nym_source_count').GetValue|0]; source persons [GetPlayer.MakeScope.Var('nym_source_people').GetValue|0].\nDestination states (Malaya/East Indies/Siam/Indochina/Philippines/Burma): [GetPlayer.MakeScope.Var('nym_count_malaya').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_east_indies').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_siam').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_indochina').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_philippines').GetValue|0]/[GetPlayer.MakeScope.Var('nym_count_burma').GetValue|0].\nAllocation cells started [GetPlayer.MakeScope.Var('nym_cells_started').GetValue|0]; positive state shares [GetPlayer.MakeScope.Var('nym_positive_shares').GetValue|0]; eligible source-to-destination pairs [GetPlayer.MakeScope.Var('nym_source_matches').GetValue|0].\nMove calls [GetPlayer.MakeScope.Var('nym_transfer_calls').GetValue|0]; requested persons [GetPlayer.MakeScope.Var('nym_transfer_requested').GetValue|0]; recorded arrivals [GetPlayer.MakeScope.Var('nym_actual').GetValue|0].\nIf verification is blocked, retain this report and error.log.\nLast request [GetPlayer.MakeScope.Var('nym_last_request').GetValue|0]; source decrease [GetPlayer.MakeScope.Var('nym_source_delta').GetValue|0]; destination increase [GetPlayer.MakeScope.Var('nym_destination_delta').GetValue|0]."
