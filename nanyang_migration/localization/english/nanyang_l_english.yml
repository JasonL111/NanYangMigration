l_english:
 je_nanyang_migration:0 "Nanyang Migration"
 je_nanyang_migration_reason:0 "For generations, families have sailed from the ports of southern China to seek a living in Nanyang. The government can now arrange passage for those who wish to make a home across the sea.\n\nExpeditions completed: [GetPlayer.MakeScope.ScriptValue('nym_uses')|0]. Current plan: [GetPlayer.MakeScope.ScriptValue('nym_target')|0] people.\nLast expedition: [GetPlayer.MakeScope.ScriptValue('nym_last_target')|0] planned, [GetPlayer.MakeScope.ScriptValue('nym_last')|0] arrived.\nIf this expedition succeeds, the next can carry [GetPlayer.MakeScope.ScriptValue('nym_following_target')|0] people."
 nym_organize_name:0 "Organize Nanyang Migration"
 nym_organize_desc:0 "Arrange passage to Nanyang for up to [GetPlayer.MakeScope.ScriptValue('nym_target')|0] people from your states.\n\nThe expedition is planned for Min 45%, Yue 30%, Hakka 15%, and Han 10%.\nDestinations are Malaya and Singapore 35%, the Dutch East Indies 25%, Siam 20%, Indochina 12%, the Philippines 5%, and Burma 3%.\n\nThe first expedition plans for 200,000 people. Each success increases the next plan by 25% up to 500,000. The fleet rests for 3 in-game years after each success."
 nym_cooldown_tt:0 "The fleet has finished refitting."
 nym_pending_tt:0 "Reports from the last voyage must come in before another fleet can depart."
 nym_attempt_tt:0 "Send the settlers to Nanyang. The arrival report will record how many reached their destinations."
 nym_success_title:0 "New Homes in Nanyang"
 nym_success_desc:0 "The fleet has reached Nanyang. Families are stepping ashore with their belongings, ready to make a living in their new homes.\n\nThe expedition planned for [GetPlayer.MakeScope.ScriptValue('nym_last_target')|0] people. [GetPlayer.MakeScope.ScriptValue('nym_last')|0] arrived.\nThe next expedition can carry [GetPlayer.MakeScope.ScriptValue('nym_target')|0] people after 3 in-game years of refitting."
 nym_failure_title:0 "A Voyage Postponed"
 nym_failure_desc:0 "The expedition did not depart and no settlers were sent. You can organize another voyage when conditions allow."
 nym_pending_title:0 "Word from Overseas"
 nym_pending_desc:0 "Reports from the ports are incomplete, so the government has put further departures on hold. To arrange this voyage again, load a save from before the expedition set out."
 nym_ack:0 "Understood"
