l_english:
 je_nanyang_migration:0 "Nanyang Migration"
 je_nanyang_migration_reason:0 "Chinese communities cross the seas to establish new homes in Southeast Asia. Organize immediate migration from all owned states.\n\nSuccessful expeditions: [GetPlayer.MakeScope.ScriptValue('nym_uses')|0]. Current target: [GetPlayer.MakeScope.ScriptValue('nym_target')|0] persons.\nLast target: [GetPlayer.MakeScope.ScriptValue('nym_last_target')|0]; last actual: [GetPlayer.MakeScope.ScriptValue('nym_last')|0].\nFollowing target after success: [GetPlayer.MakeScope.ScriptValue('nym_following_target')|0]. Consult the button conditions for the five-year cooldown."
 nym_organize_name:0 "Organize Nanyang Migration"
 nym_organize_desc:0 "Target: [GetPlayer.MakeScope.ScriptValue('nym_target')|0] persons from all owned states, without source province restrictions.\nCultures: Min 45%, Yue 30%, Hakka 15%, Han 10%.\nDestinations: Malaya/Singapore 35%, East Indies 25%, Siam 20%, Indochina 12%, Philippines 5%, Burma 3%, using the fixed cross-matrix. Equal shares across actual states with integer remainders.\nFive-year cooldown on success; target grows by 25%, capped at 5 million. Shortages permit partial execution; zero movement consumes neither cooldown nor a successful use."
 nym_cooldown_tt:0 "Five in-game years have elapsed since the last successful expedition (no wait for first use)"
 nym_attempt_tt:0 "Immediately transfer existing people using the fixed culture/geography matrix; see the result notification for actual movement."
 nym_success_title:0 "New Homes in Nanyang"
 nym_success_desc:0 "Target: [GetPlayer.MakeScope.ScriptValue('nym_last_target')|0] persons.\nActually moved: [GetPlayer.MakeScope.ScriptValue('nym_last')|0].\nSuccessful expeditions: [GetPlayer.MakeScope.ScriptValue('nym_uses')|0]. Next target: [GetPlayer.MakeScope.ScriptValue('nym_target')|0].\nA five-year cooldown has begun. Unavailable shares are not reassigned. Migrants retain their culture and religion; native rules govern unemployment and occupational changes."
 nym_failure_title:0 "The Expedition Could Not Depart"
 nym_failure_desc:0 "Recorded arrivals are zero. No successful use or cooldown was consumed. This does not establish a national population shortage: check eligible cultures, destinations and script error logs. If populations changed despite a zero record, this is a script or accounting error. The last successful record is unchanged."
 nym_ack:0 "Understood"
