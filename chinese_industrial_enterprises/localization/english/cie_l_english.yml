l_english:
 cie_huaxing_industries:0 "Huaxing Industries"
 cie_huaxing_industries_desc:0 "Huaxing holds machinery to be the foundation of every trade and inquiry the beginning of national prosperity. From the steel furnace to the railway and the power station, it brings Chinese industry and scientific learning to the work of building the country.\n\nStudy the nature of things to strengthen the nation through industry."
 cie_shandong_agricultural_group:0 "Shandong Agricultural Group"
 cie_shandong_agricultural_group_desc:0 "The fertile plains of Shandong have long sustained the country. The Group improves cultivation, introduces modern implements, and brings grain and fruit to market in plenty. Its foremost ambition is to keep the granaries full.\n\nWith full granaries, the people may live at ease."
 cie_fengzhi_trading_house:0 "Fengzhi Trading House"
 cie_fengzhi_trading_house_desc:0 "Every crop has its season and every soil its proper use. The house of Fengzhi raises tea, mulberry, cotton, and cane where they thrive, then sends the produce through its network of merchants.\n\nHeed the seasons and bring the harvest to every shore."
 cie_chinese_mining_corporation:0 "Chinese Mining Corporation"
 cie_chinese_mining_corporation_desc:0 "The Corporation surveys hills and valleys, sinks shafts, and introduces modern mining methods. Its workings furnish the railways, workshops, and furnaces with the minerals upon which Chinese industry depends.\n\nDraw forth the riches of the mountains and lay the foundations of prosperity."
 cie_chinese_petroleum_company:0 "Chinese Petroleum Company"
 cie_chinese_petroleum_company_desc:0 "Petroleum is the motive power of a new age. The company prospects for oil, drills modern wells, and supplies Chinese transport and industry with the fuel their machinery requires."
 cie_huaguang_electric_company:0 "Huaguang Electric Company"
 cie_huaguang_electric_company_desc:0 "Once the current flows, mills may run after dark and streets need no longer fall silent with the sunset. Huaguang builds power stations and carries electricity to workshops and households across town and countryside."
 cie_shenzhou_motor_works:0 "Shenzhou Motor Works"
 cie_shenzhou_motor_works_desc:0 "Where horses once drew carts, the motor now takes their place. Shenzhou builds engines and motorcars for Chinese roads, hastening the passage of people and goods between town and country."
 cie_lingyun_aviation_works:0 "Lingyun Aviation Works"
 cie_lingyun_aviation_works_desc:0 "Even the sky admits a road. Lingyun brings together trained engineers to build flying machines and precision instruments, opening a new field for Chinese industry."
 cie_huaxing_levels_tt:0 "At least #v 30#! combined levels of Automotive Industries, Tooling Workshops, Steel Mills, Motor Industries, civilian Shipyards, Railways, and Power Plants in the country."
 cie_shandong_levels_tt:0 "An owned headquarters state in Shandong with at least #v 20#! combined levels of grain farms and banana plantations."
 cie_fengzhi_levels_tt:0 "At least #v 20#! combined levels of cash-crop plantations and vineyards in the country, excluding banana plantations."
 cie_mining_levels_tt:0 "At least #v 20#! combined levels of coal, iron, copper, lead, sulfur, and gold mines in the country."
 cie_shenzhou_levels_tt:0 "At least #v 20#! combined levels of Automotive Industries and Motor Industries in the country."
 cie_huaxing_precision_machinery:0 "Huaxing Precision Machinery"
 cie_huaxing_precision_machinery_desc:0 "Gauged to exact tolerances, Huaxing tools are prized by workshops for their long service."
 cie_shandong_premium_grain:0 "Shandong Premium Grain"
 cie_shandong_premium_grain_desc:0 "Carefully sorted, dried, and sealed for shipment, this grain is sold to a dependable standard."
 cie_fengzhi_imperial_tea:0 "Fengzhi Imperial Tea"
 cie_fengzhi_imperial_tea_desc:0 "Picked from the first spring shoots and fired with care, Fengzhi tea keeps its fragrance as it travels from port to port."
 cie_chinese_premium_coal:0 "Chinese Premium Coal"
 cie_chinese_premium_coal_desc:0 "Sorted and washed for a steady fire, this coal serves boilers and furnaces through long shifts."
 cie_chinese_premium_petroleum:0 "Chinese Premium Petroleum"
 cie_chinese_premium_petroleum_desc:0 "Oil from modern wells, graded and stored for shipment to workshops and transport depots."
 cie_huaguang_electric_apparatus:0 "Huaguang Electric Apparatus"
 cie_huaguang_electric_apparatus_desc:0 "Well-made Huaguang telephone sets carry the voice between offices, mills, and merchant houses."
 cie_shenzhou_motorcars:0 "Shenzhou Motorcars"
 cie_shenzhou_motorcars_desc:0 "A sturdy body and a serviceable engine make these motorcars suited to roads in town and country."
 cie_lingyun_aircraft:0 "Lingyun Aircraft"
 cie_lingyun_aircraft_desc:0 "Light timber and stretched fabric take wing under the hands of Chinese mechanics and test pilots."
