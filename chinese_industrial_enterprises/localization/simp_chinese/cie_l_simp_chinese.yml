l_simp_chinese:
 cie_huaxing_industries:0 "华兴实业"
 cie_huaxing_industries_desc:0 "华兴以机器为百业之本，以格物为富强之基。自冶铁铸钢至铁路电气，其事业遍及近代工业诸门，务求以本国之实业支撑国家之建设，以科学之进步开拓富强之途。\n\n格物致知，实业兴邦。"
 cie_shandong_agricultural_group:0 "鲁农集团"
 cie_shandong_agricultural_group_desc:0 "鲁地沃野千里，素为天下农桑之重。鲁农集团广兴农事，改良耕法，推广新式农具，使五谷丰登、果实盈仓。其志不独在商利，更在仓廪充实、百姓丰足。\n\n仓廪既实，百姓乃安。"
 cie_fengzhi_trading_house:0 "丰殖商号"
 cie_fengzhi_trading_house_desc:0 "天地有时，百物有宜。丰殖商号以茶桑棉蔗为业，广植四方之物，通行海内之货。凡山川土壤所宜，皆可因地制用，使物产日丰，商利日广。\n\n顺天地之时，殖四海之利。"
 cie_chinese_mining_corporation:0 "中华矿业总公司"
 cie_chinese_mining_corporation_desc:0 "山川所藏，皆为富国之资。中华矿业总公司广事勘探，开矿凿井，引入新式采掘之法，为铁路、机器、钢铁及各项实业供应不竭之原料。\n\n发山川之藏，筑富强之基。"
 cie_chinese_petroleum_company:0 "中华石油公司"
 cie_chinese_petroleum_company_desc:0 "地中石油，乃新世机器之动力。中华石油公司专事勘探与开采，以近代钻井之法广发地下能源，为国家运输、工业及机器事业提供所需燃料。"
 cie_huaguang_electric_company:0 "华光电气公司"
 cie_huaguang_electric_company_desc:0 "电气既通，则昼夜无碍，机器不息。华光电气公司致力于广设电厂、铺设电网，使城乡工商业皆得新式动力之利，以电气照耀万家。"
 cie_shenzhou_motor_works:0 "神州汽车制造公司"
 cie_shenzhou_motor_works_desc:0 "昔日车马所至，今以机器代之。神州汽车制造公司专研内燃机及机动车辆，务求以本国制造之汽车通行城乡，使人货往来迅捷便利。"
 cie_lingyun_aviation_works:0 "凌云航空制造公司"
 cie_lingyun_aviation_works_desc:0 "九天之上，亦有通途。凌云航空制造公司汇集新式工程人才，研制飞行机器及精密器械，以本国工业之力开拓航空事业，使中华实业之志凌云而上。"
 cie_huaxing_levels_tt:0 "本国的汽车工业、工具工坊、钢铁厂、发动机厂、铁路和发电厂合计至少达到 #v 30#! 级。"
 cie_shandong_levels_tt:0 "本国在山东须拥有可设总部的州，该州的粮食农场与香蕉种植园合计至少达到 #v 20#! 级。"
 cie_fengzhi_levels_tt:0 "本国的非水果经济作物种植园和葡萄园合计至少达到 #v 20#! 级。"
 cie_mining_levels_tt:0 "本国的煤矿、铁矿、铜矿、铅矿、硫矿和金矿合计至少达到 #v 20#! 级。"
 cie_shenzhou_levels_tt:0 "本国的汽车工业和发动机厂合计至少达到 #v 20#! 级。"
 cie_huaxing_precision_machinery:0 "华兴精密机械"
 cie_huaxing_precision_machinery_desc:0 "以新式量具校验的华兴工器，坚实耐用，为各地工场所重。"
 cie_shandong_premium_grain:0 "鲁农优质粮食"
 cie_shandong_premium_grain_desc:0 "择粒筛杂，干贮封运。鲁农所出粮谷，品质有定。"
 cie_fengzhi_imperial_tea:0 "丰殖贡茶"
 cie_fengzhi_imperial_tea_desc:0 "择春芽而采，依火候而焙。丰殖的茶箱运抵各埠，开封犹有清香。"
 cie_chinese_premium_coal:0 "中华精煤"
 cie_chinese_premium_coal_desc:0 "经拣选洗炼的煤炭火力稳定，锅炉与冶炉皆可长时运转。"
 cie_chinese_premium_petroleum:0 "中华石油"
 cie_chinese_premium_petroleum_desc:0 "以新式钻井采得的石油，分级贮运，供应各地厂栈。"
 cie_huaguang_electric_apparatus:0 "华光电气设备"
 cie_huaguang_electric_apparatus_desc:0 "华光精制的电话机，使商栈、工场与官署得以隔地通话。"
 cie_shenzhou_motorcars:0 "神州牌汽车"
 cie_shenzhou_motorcars_desc:0 "神州牌车身坚固，引擎易于调校，专为城乡道路所制。"
 cie_lingyun_aircraft:0 "凌云飞机"
 cie_lingyun_aircraft_desc:0 "轻木为骨，蒙布为翼。凌云飞行机器由本国工师装配、试飞。"
