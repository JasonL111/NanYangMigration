l_simp_chinese:
 ocm_je_mobilization:0 "动员侨民"
 ocm_je_mobilization_reason:0 "远渡重洋的中华儿女，早已在世界各地建立起自己的商会、会馆与社区。当侨民人口在异国社会中占据重要地位时，他们争取文化承认与政治地位的呼声也日益高涨。我们可以借助故土与海外侨乡之间的联系，推动当地国家将汉文化纳入其主流文化。"
 ocm_mobilize_name:0 "动员侨民"
 ocm_mobilize_desc:0 "由符合资格的中国玩家发动。各国只有在汉、闽、粤、客家人口合计达到全国总人口的40%、尚未以汉文化为主流文化且不属于霸权级时，才可响应。\n\n所有符合条件的外国都会将汉文化加入既有主流文化。无需花费资源，也无需等待冷却。"
 ocm_player_required:0 "由玩家执掌大清或符合资格的中国继承政权"
 ocm_target_required:0 "至少有一个非霸权级外国的汉、闽、粤、客家人口合计达全国人口的40%，且尚未将汉文化列为主流文化"
 ocm_recognition_effect:0 "所有符合条件的外国将在保留既有主流文化的同时，将汉文化纳入主流文化。"
 ocm_success_title:0 "四海同胞，落地生根"
 ocm_success_desc:0 "数十年来，来自中华大地的移民远渡重洋，在异国他乡建立起自己的商会、会馆与社区。从码头上的劳工，到市镇中的商贾，再到当地社会的重要组成部分，侨民的影响力早已今非昔比。\n\n随着海外中华文化人口不断增长，当地侨民代表开始联合起来，寻求更加稳固的文化地位，并推动中华文化成为国家认同的一部分。\n\n如今，他们的努力终于获得了承认。故土与侨乡之间的联系，也由此翻开了崭新的一页。\n\n共有 [SCOPE.GetValue('ocm_confirmed_recognitions')|0] 个国家将汉文化纳入了主流文化。"
 ocm_success_ack:0 "四海之内，皆有故乡。"
 ocm_no_recognition_title:0 "请愿未果"
 ocm_no_recognition_desc:0 "这次请愿未能促成新的文化承认。官府尚未收到任何国家将汉文化纳入主流文化的确认。"
 ocm_no_recognition_ack:0 "再等时机。"
