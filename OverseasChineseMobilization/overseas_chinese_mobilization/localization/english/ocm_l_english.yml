l_english:
 ocm_je_mobilization:0 "Mobilize the Overseas Chinese"
 ocm_je_mobilization_reason:0 "Across the seas, Chinese emigrants have founded chambers of commerce, guild halls, and communities of their own. As their communities grow, so too do their calls for cultural recognition and a voice in public life. The ties between China and its people abroad may help persuade their adopted countries to recognize Han among their primary cultures."
 ocm_mobilize_name:0 "Mobilize Overseas Chinese"
 ocm_mobilize_desc:0 "Available to a player governing China or an eligible successor. Foreign countries may respond if they are below the Hegemony tier, Han is not already a primary culture, and their Han, Min, Yue, and Hakka populations together make up at least 40% of all residents.\n\nEvery eligible country adds Han alongside its existing primary cultures. There is no cost or cooldown."
 ocm_player_required:0 "A player governs China or an eligible Chinese successor"
 ocm_target_required:0 "At least one foreign country below Hegemony tier has a combined Han, Min, Yue, and Hakka population of at least 40% and lacks Han as a primary culture"
 ocm_recognition_effect:0 "Every eligible foreign country recognizes Han as a primary culture alongside its existing primary cultures."
 ocm_success_title:0 "Roots Beyond the Seas"
 ocm_success_desc:0 "For decades, emigrants from China have crossed the seas and founded chambers of commerce, guild halls, and communities in distant lands. From the laborers on the wharves to the merchants in the towns, their place in local life has grown steadily.\n\nAs these communities have prospered, their delegates have come together to press for lasting recognition and a place in the national life of their adopted countries.\n\nAt last, their efforts have borne fruit. A new chapter has opened in the ties between the homeland and its communities overseas.\n\n[SCOPE.GetValue('ocm_confirmed_recognitions')|0] countries have recognized Han as a primary culture."
 ocm_success_ack:0 "Across the seas, we find new homes."
 ocm_no_recognition_title:0 "Petitions Unanswered"
 ocm_no_recognition_desc:0 "The petitions have brought no new recognition. We have received no confirmation that a country has added Han to its primary cultures."
 ocm_no_recognition_ack:0 "The time may yet come."
