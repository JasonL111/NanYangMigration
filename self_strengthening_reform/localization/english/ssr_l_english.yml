l_english:
 ssr_je_reform:0 "Self-Strengthening Reform"
 ssr_je_reform_reason:0 "The powers abroad grow stronger through commerce, machinery, and modern arms, while our affairs are still governed by inherited forms. Advocates of self-strengthening call for new enterprises and schools, the reorganization of the armed forces, and a wider path to office for those of ability.\n\nIf the dynasty is to endure and the country to prosper, the rising interests must have a place in its councils. The business of government can no longer be left to the landed gentry alone."
 ssr_reform_button_name:0 "Reform the Old Institutions"
 ssr_reform_button_desc:0 "Convene the reformers to consider a #v 20-year#! program.\n\nLandowners receive #v −50%#! Political Strength and #v −5#! Approval.\nIntelligentsia and Industrialists each receive #v +25%#! Political Strength and #v +5#! Approval."
 ssr_requires_player_monarchy:0 "A player governs an eligible Chinese monarchy"
 ssr_requires_year:0 "The year is #v 1861#! or later"
 ssr_requires_landowner_clout:0 "The Landowners hold at least #v 20%#! Clout"
 ssr_requires_unused_reform:0 "The Self-Strengthening Reforms have yet to be enacted in this campaign"
 ssr_requires_no_open_petition:0 "There is no outstanding reform petition"
 ssr_open_petition_tt:0 "Opens The Reformers Petition the Throne"
 ssr_petition_title:0 "The Reformers Petition the Throne"
 ssr_petition_desc:0 "The powers of the West press eastward and grow stronger by the day. The business of our court is still conducted in timeworn forms, and the defenders of custom invoke our ancestors at every turn to thwart new measures.\n\nSince men such as Zeng Guofan, Li Hongzhang, and Zuo Zongtang championed self-strengthening, the case for new workshops, modern arms, and schools has won a hearing among thoughtful people at court and beyond.\n\nIronclads and artillery may defend the realm. But while the avenues to office remain narrow and men versed in practical affairs are passed over, the work of self-strengthening cannot endure.\n\nMemorial after memorial asks the throne to open public service to new talent and allow able men beyond the landed gentry to take part in government.\n\nTo preserve what our ancestors built, we must decide which of their institutions still serve it."
 ssr_reform_enact:0 "The institutions of our ancestors must adapt to the times."
 ssr_reform_defer:0 "Such matters require further deliberation."
 ssr_reform_defer_tt:0 "Set aside the petition. It can be raised again when the conditions are met."
 ssr_reform_outcome:0 "The reform petition is granted"
 ssr_reform_outcome_effect:0 "Enact the Self-Strengthening Reforms"
 ssr_je_reform_concluded_desc:0 "The court has authorized the reforms. Men versed in practical affairs may now find a path to office, and the advocates of new schools and industry have gained a hearing in the councils of state."
 ssr_reforms:0 "The Self-Strengthening Reforms"
