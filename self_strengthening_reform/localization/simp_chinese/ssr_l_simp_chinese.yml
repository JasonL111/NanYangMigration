l_simp_chinese:
 ssr_je_reform:0 "洋务自强"
 ssr_je_reform_reason:0 "列国以机器、工商与新式军备日益强盛，而朝廷治国之制仍多沿袭旧章。自强之士相继倡议兴办实业、广设学堂、整顿军备，并主张广开仕途，不拘一格选用人才。\n\n若欲振兴国势，便须在保全社稷的同时，使新兴政治力量得以参与国家治理，逐步改变旧有士绅独占政事的局面。"
 ssr_reform_button_name:0 "整顿旧制，推行新政"
 ssr_reform_button_desc:0 "召集洋务诸臣，议定为期 #v 20 年#! 的新政。\n\n地主政治力量 #v −50%#!，认同度 #v −5#!。\n知识分子政治力量 #v +25%#!，认同度 #v +5#!。\n实业家政治力量 #v +25%#!，认同度 #v +5#!。"
 ssr_requires_player_monarchy:0 "由玩家控制的合格中国国家仍实行君主制"
 ssr_requires_year:0 "当前年份为 #v 1861 年#! 或以后"
 ssr_requires_landowner_clout:0 "地主的政治影响力占比至少为 #v 20%#!"
 ssr_requires_unused_reform:0 "本局尚未实施洋务新政"
 ssr_requires_no_open_petition:0 "上一份洋务奏议已处理，或尚未提交奏议"
 ssr_open_petition_tt:0 "开启奏议「洋务诸臣，力陈积弊」"
 ssr_petition_title:0 "洋务诸臣，力陈积弊"
 ssr_petition_desc:0 "西力东渐，列国日强，而朝廷旧制积弊已久，守旧之士仍以祖宗成法为由，屡屡阻挠新政。\n\n自曾国藩、李鸿章、左宗棠等人倡议自强以来，兴办实业、整顿军备、广设学堂之议，已逐渐成为朝野有识之士的共识。\n\n然而，坚船利炮固可强国，若国家仕途仍囿于旧制，通晓实务之人才不得其用，则自强之业终难长久。\n\n诸臣相继上奏，请朝廷广开仕途，重用新式人才，使士绅之外的各界人士亦得参与国政。\n\n欲保祖宗之社稷，未必尽守祖宗之成法。"
 ssr_reform_enact:0 "祖宗之法，亦当因时而变。"
 ssr_reform_defer:0 "此事尚需从长计议。"
 ssr_reform_defer_tt:0 "暂且搁置奏议。条件具备时，仍可另行提议。"
 ssr_reform_outcome:0 "洋务奏议获准"
 ssr_reform_outcome_effect:0 "推行洋务新政"
 ssr_je_reform_concluded_desc:0 "朝廷准行洋务新政。通晓实务之士得以跻身仕途，新式学堂与实业的倡议者也迎来了参政的机遇。"
 ssr_reforms:0 "洋务新政"
